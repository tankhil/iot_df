services:
  postgres:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: iot_defense
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot -d iot_defense"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [iot-lab]

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/#", "-C", "1", "-W", "2"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [iot-lab]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    command: alembic upgrade head
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [iot-lab]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ./models
        target: /app/models
        bind:
          create_host_path: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [iot-lab]

  collector:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    command: python -m app.worker
    env_file: .env
    volumes:
      - type: bind
        source: ./models
        target: /app/models
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    networks: [iot-lab]

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    command: python /workspace/simulator/devices/run_devices.py --interval-scale 0.2
    env_file: .env
    depends_on:
      mosquitto:
        condition: service_started
    networks: [iot-lab]

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    networks: [iot-lab]

volumes:
  postgres-data:

networks:
  iot-lab:
    driver: bridge
