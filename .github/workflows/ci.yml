name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend and simulator
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/build-requirements.lock
            backend/requirements-dev.lock

      - name: Install Python dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e backend

      - name: Check Python dependency lock
        run: python scripts/check_python_lock.py

      - name: Audit Python runtime dependencies
        run: pip-audit -r backend/requirements.lock

      - name: Audit installed Python environment
        run: pip-audit --local --skip-editable

      - name: Run tests
        run: python -m pytest -q backend/tests simulator/tests

      - name: Run Ruff
        run: python -m ruff check backend/app backend/tests simulator scripts

      - name: Run mypy
        working-directory: backend
        run: python -m mypy app

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.5"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Audit dashboard runtime dependencies
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit dashboard full dependency tree
        working-directory: dashboard
        run: npm audit --audit-level=moderate

      - name: Typecheck dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Test dashboard
        working-directory: dashboard
        run: npm run test

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

  container-security:
    name: Runtime container security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        # actions/checkout v4.4.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build backend runtime image
        run: docker build --build-arg APP_UID=1000 --build-arg APP_GID=1000 -t iot-df-backend:ci -f backend/Dockerfile .

      - name: Build dashboard runtime image
        run: docker build -t iot-df-dashboard:ci -f dashboard/Dockerfile .

      - name: Report all backend OS vulnerabilities
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: iot-df-backend:ci
          vuln-type: os
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "0"

      - name: Fail on fixed high/critical backend OS vulnerabilities
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: iot-df-backend:ci
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Report all dashboard OS vulnerabilities
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: iot-df-dashboard:ci
          vuln-type: os
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "0"

      - name: Fail on fixed high/critical dashboard OS vulnerabilities
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: iot-df-dashboard:ci
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
